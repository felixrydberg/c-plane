version: 0.1

log:
  level: info

http:
  addr: :5000

storage:
  s3:
    region: us-east-1
    bucket: cplane-registry
    secure: true
    v4auth: true
  redirect:
    disable: true
  delete:
    enabled: true

auth:
  token:
    realm: http://localhost:8080/api/registry/token
    service: localhost:5000
    issuer: cplane-registry
    rootcertbundle: /run/registry/registry-token-public.pem
    signingalgorithms:
      - RS256

validation:
  disabled: false
