[package]
name = "cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
lib = { path = "../lib" }
sea-orm = { version = "1.1.15", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
