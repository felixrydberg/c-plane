[package]
name = "lib"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
aws-sdk-s3 = "=1.135.0"
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
sea-orm = { version = "1.1.15", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-uuid", "postgres-array"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
redis = { version = "0.32", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
utoipa = { version = "5", features = ["uuid", "chrono"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
