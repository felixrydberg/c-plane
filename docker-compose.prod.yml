name: cplane-prod
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: api
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      BETTER_AUTH_SESSION_URL: http://ui:3000/api/auth/get-session
      IDENTITY_DATABASE_URL: postgresql://cplane_identity:${POSTGRES_IDENTITY_PASSWORD}@postgresd:5432/cplane
      TENANT_DATABASE_URL: postgresql://cplane_tenant:${POSTGRES_TENANT_PASSWORD}@postgresd:5432/cplane
      CONTROL_PLANE_URL: http://control-plane:3001
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL}
      REGISTRY_HOST: ${REGISTRY_HOST}
      REGISTRY_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER:-cplane-registry}
      REGISTRY_TOKEN_PRIVATE_KEY_PATH: /run/registry/registry-token-private.pem
      REGISTRY_TOKEN_CERTIFICATE_PATH: /run/registry/registry-token-public.pem
    depends_on:
      - postgresd
      - ui
      - control-plane
    ports:
      - 8080:8080
    volumes:
      - ./.secrets/registry-token-private.pem:/run/registry/registry-token-private.pem:ro
      - ./.secrets/registry-token-public.pem:/run/registry/registry-token-public.pem:ro

  storage:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: storage
        BINARY: c-plane-storage
    environment:
      STORAGE_LISTEN: 0.0.0.0:8081
      CONTROL_PLANE_URL: http://control-plane:3001
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
    depends_on:
      - control-plane
    ports:
      - 8081:8081

  ui:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        PACKAGE: ui
      target: "production"
    environment:
      NODE_ENV: production
      NUXT_DATABASE_URL: postgresql://ui:${POSTGRES_UI_PASSWORD}@postgresd:5432/cplane
      NUXT_IDENTITY_DATABASE_URL: postgresql://cplane_identity:${POSTGRES_IDENTITY_PASSWORD}@postgresd:5432/cplane
      NUXT_TENANT_DATABASE_URL: postgresql://cplane_tenant:${POSTGRES_TENANT_PASSWORD}@postgresd:5432/cplane
      NUXT_REDIS_URL: redis://valkey:6379
      NUXT_AUTH_BASE_URL: http://ui:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BACKEND_URL: http://api:8080
      NUXT_PUBLIC_REGISTRY_HOST: ${REGISTRY_HOST}
    ports:
      - 3000:3000
      - 24678:24678
    develop:
      watch:
        - action: sync
          path: ./packages/ui
          target: /usr/src/app/packages/ui
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
        - action: sync
          path: ./packages/ui-shared
          target: /usr/src/app/packages/ui-shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/ui/package.json
        - action: rebuild
          path: ./packages/ui-shared/package.json

  registry:
    image: registry:3.1.1
    restart: unless-stopped
    environment:
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
      - REGISTRY_AUTH_TOKEN_REALM=${REGISTRY_TOKEN_REALM}
      - REGISTRY_AUTH_TOKEN_SERVICE=${REGISTRY_HOST}
      - REGISTRY_AUTH_TOKEN_ISSUER=${REGISTRY_TOKEN_ISSUER:-cplane-registry}
      - REGISTRY_STORAGE_S3_REGION
      - REGISTRY_STORAGE_S3_REGIONENDPOINT=http://storage:8081
      - REGISTRY_STORAGE_S3_FORCEPATHSTYLE=true
      - REGISTRY_STORAGE_S3_SECURE=false
      - REGISTRY_STORAGE_S3_BUCKET
      - REGISTRY_STORAGE_S3_ACCESSKEY
      - REGISTRY_STORAGE_S3_SECRETKEY
    volumes:
      - ./packages/registry/config.yml:/etc/distribution/config.yml:ro
      - ./.secrets/registry-token-public.pem:/run/registry/registry-token-public.pem:ro
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - storage

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.dioxus
      target: "production"
    environment:
      ADMIN_DATABASE_URL: postgresql://cplane_admin:${POSTGRES_ADMIN_PASSWORD}@postgresd:5432/cplane
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_ROOT_TOKEN}
      REDIS_URL: redis://valkey:6379
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
      REGISTRY_STORAGE_S3_PROVIDER_ID: ${REGISTRY_STORAGE_S3_PROVIDER_ID:-}
      REGISTRY_STORAGE_S3_BUCKET: ${REGISTRY_STORAGE_S3_BUCKET}
      REGISTRY_STORAGE_S3_PHYSICAL_BUCKET: ${REGISTRY_STORAGE_S3_PHYSICAL_BUCKET:-}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${REGISTRY_STORAGE_S3_ACCESSKEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${REGISTRY_STORAGE_S3_SECRETKEY}
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3001"

  postgresd:
    image: postgres:18
    environment:
      POSTGRES_DB: cplane
      POSTGRES_USER: cplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_UI_PASSWORD: ${POSTGRES_UI_PASSWORD}
      POSTGRES_IDENTITY_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      POSTGRES_TENANT_PASSWORD: ${POSTGRES_TENANT_PASSWORD}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./packages/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cplane"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        PACKAGE: ui-shared
      target: migration
    environment:
      DATABASE_URL: postgresql://cplane:${POSTGRES_PASSWORD}@postgresd:5432/cplane
    depends_on:
      postgresd:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1.3
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data

  openbao:
    image: openbao/openbao:2.5.5
    command: server
    environment:
      BAO_LOCAL_CONFIG: >-
        {"disable_mlock":true,"api_addr":"http://openbao:8200","cluster_addr":"http://openbao:8201","listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"storage":{"raft":{"path":"/openbao/file","node_id":"cplane"}}}
    volumes:
      - openbao_data:/openbao/file
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1 || [ $? -eq 2 ]"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao-init:
    image: openbao/openbao:2.5.5
    command: ["sh", "-ec", "bao operator unseal \"$${BAO_UNSEAL_KEY}\" && (bao secrets enable -path=cplane -version=2 kv 2>/dev/null || true)"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${OPENBAO_ROOT_TOKEN}
      BAO_UNSEAL_KEY: ${OPENBAO_UNSEAL_KEY}
    depends_on:
      openbao:
        condition: service_healthy

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    depends_on:
      - postgresd
    environment:
      PORT: 4983
      DATABASE_URL_DEFAULT: postgresql://cplane:${POSTGRES_PASSWORD}@postgresd:5432/cplane
    ports:
      - "8001:4983"
    volumes:
      - drizzle-gateway:/app

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ui

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  valkey-data:
  drizzle-gateway:
  openbao_data:
