name: cplane-prod
services:
  ingress:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: ingress
        BINARY: c-plane-ingress
    restart: unless-stopped
    environment:
      INGRESS_LISTEN: 0.0.0.0:8080
      INGRESS_MANAGEMENT_LISTEN: 0.0.0.0:9090
      INGRESS_PLATFORM_HOSTS: ${INGRESS_PLATFORM_HOSTS:?Set the platform authority}
      INGRESS_API_HOSTS: ${INGRESS_API_HOSTS:?Set the API authority}
      INGRESS_STORAGE_HOSTS: ${INGRESS_STORAGE_HOSTS:?Set the Storage authority}
      INGRESS_STORAGE_HOST_SUFFIXES: ${INGRESS_STORAGE_HOST_SUFFIXES:-}
      INGRESS_REGISTRY_HOSTS: ${INGRESS_REGISTRY_HOSTS:?Set the Registry authority}
      INGRESS_UI_UPSTREAM: ui:3000
      INGRESS_API_UPSTREAM: api:8080
      INGRESS_STORAGE_UPSTREAM: storage:8081
      INGRESS_REGISTRY_UPSTREAM: registry:5000
      INGRESS_FORWARDED_PROTO: ${INGRESS_FORWARDED_PROTO:-https}
      INGRESS_CLIENT_IP_HEADER: ${INGRESS_CLIENT_IP_HEADER:-}
      INGRESS_TRUSTED_PROXY_CIDRS: ${INGRESS_TRUSTED_PROXY_CIDRS:-}
      INGRESS_RATE_MODE: ${INGRESS_RATE_MODE:-observe}
      RUST_LOG: ${INGRESS_LOG:-c_plane_ingress=info}
    depends_on:
      - api
      - storage
      - ui
      - registry
    ports:
      - "${INGRESS_PORT:-8080}:8080"
      - "127.0.0.1:${INGRESS_MANAGEMENT_PORT:-9090}:9090"

  api:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: api
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      BETTER_AUTH_SESSION_URL: http://ui:3000/ui-api/auth/get-session
      IDENTITY_DATABASE_URL: postgresql://cplane_identity:${POSTGRES_IDENTITY_PASSWORD}@postgresd:5432/cplane
      TENANT_DATABASE_URL: postgresql://cplane_tenant:${POSTGRES_TENANT_PASSWORD}@postgresd:5432/cplane
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_ROLE_ID: ${OPENBAO_API_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_API_SECRET_ID:-}
      REDIS_URL: redis://valkey:6379
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL}
      STORAGE_INTERNAL_URL: http://storage:8081
      REGISTRY_HOST: ${REGISTRY_HOST}
      REGISTRY_INTERNAL_URL: ${REGISTRY_INTERNAL_URL:-http://registry:5000}
      REGISTRY_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER:-cplane-registry}
      REGISTRY_TOKEN_TTL_SECONDS: ${REGISTRY_TOKEN_TTL_SECONDS:-60}
      REGISTRY_TOKEN_SECRET: ${REGISTRY_TOKEN_SECRET}
    depends_on:
      postgresd:
        condition: service_started
      ui:
        condition: service_started
      openbao-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started

  storage:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: storage
        BINARY: c-plane-storage
    environment:
      STORAGE_LISTEN: 0.0.0.0:8081
      API_URL: http://api:8080
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
    depends_on:
      - api

  ui:
    build:
      context: .
      dockerfile: Dockerfile.deno
      args:
        PACKAGE: ui
      target: "production"
    environment:
      NODE_ENV: production
      NUXT_DATABASE_URL: postgresql://ui:${POSTGRES_UI_PASSWORD}@postgresd:5432/cplane
      NUXT_IDENTITY_DATABASE_URL: postgresql://cplane_identity:${POSTGRES_IDENTITY_PASSWORD}@postgresd:5432/cplane
      NUXT_TENANT_DATABASE_URL: postgresql://cplane_tenant:${POSTGRES_TENANT_PASSWORD}@postgresd:5432/cplane
      NUXT_REDIS_URL: redis://valkey:6379
      NUXT_AUTH_BASE_URL: ${NUXT_AUTH_BASE_URL:?Set NUXT_AUTH_BASE_URL to the public HTTPS origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NUXT_BACKEND_URL: http://api:8080
      NUXT_PUBLIC_REGISTRY_HOST: ${REGISTRY_HOST}
    develop:
      watch:
        - action: sync
          path: ./packages/ui
          target: /usr/src/app/packages/ui
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
        - action: sync
          path: ./packages/migrations
          target: /usr/src/app/packages/migrations
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/ui/package.json
        - action: rebuild
          path: ./packages/migrations/package.json

  registry:
    image: registry:3.1.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/distribution/start.sh"]
    environment:
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET}
      - REGISTRY_TOKEN_SECRET=${REGISTRY_TOKEN_SECRET}
      - REGISTRY_AUTH_TOKEN_REALM=${REGISTRY_TOKEN_REALM}
      - REGISTRY_AUTH_TOKEN_SERVICE=${REGISTRY_HOST}
      - REGISTRY_AUTH_TOKEN_ISSUER=${REGISTRY_TOKEN_ISSUER:-cplane-registry}
      - REGISTRY_STORAGE_S3_REGION
      - REGISTRY_STORAGE_S3_REGIONENDPOINT=http://storage:8081
      - REGISTRY_STORAGE_S3_FORCEPATHSTYLE=true
      - REGISTRY_STORAGE_S3_SECURE=false
      - REGISTRY_STORAGE_S3_BUCKET
      - REGISTRY_STORAGE_S3_ACCESSKEY
      - REGISTRY_STORAGE_S3_SECRETKEY
    volumes:
      - ./packages/registry/config.yml:/etc/distribution/config.yml:ro
      - ./packages/registry/start.sh:/etc/distribution/start.sh:ro
    depends_on:
      - storage

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.dioxus
      target: "production"
    environment:
      ADMIN_DATABASE_URL: postgresql://cplane_admin:${POSTGRES_ADMIN_PASSWORD}@postgresd:5432/cplane
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_ROLE_ID: ${OPENBAO_CONTROL_PLANE_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_CONTROL_PLANE_SECRET_ID:-}
      REDIS_URL: redis://valkey:6379
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3001"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: worker
        BINARY: c-plane-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cplane_admin:${POSTGRES_ADMIN_PASSWORD}@postgresd:5432/cplane
      REDIS_URL: redis://valkey:6379
      WORKER_QUEUES: maintenance
      WORKER_CONCURRENCY: 1
      REGISTRY_TOKEN_TTL_SECONDS: ${REGISTRY_TOKEN_TTL_SECONDS:-60}
      REGISTRY_STORAGE_S3_REGION: ${REGISTRY_STORAGE_S3_REGION}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://storage:8081
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_BUCKET: ${REGISTRY_STORAGE_S3_BUCKET}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${REGISTRY_STORAGE_S3_GC_ACCESSKEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${REGISTRY_STORAGE_S3_GC_SECRETKEY}
    volumes:
      - ./packages/registry/config-gc.yml:/etc/distribution/config.yml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started
      valkey:
        condition: service_started
      api:
        condition: service_started

  postgresd:
    image: postgres:18
    environment:
      POSTGRES_DB: cplane
      POSTGRES_USER: cplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_UI_PASSWORD: ${POSTGRES_UI_PASSWORD}
      POSTGRES_IDENTITY_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      POSTGRES_TENANT_PASSWORD: ${POSTGRES_TENANT_PASSWORD}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./packages/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cplane"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.deno
      args:
        PACKAGE: migrations
      target: migration
    environment:
      DATABASE_URL: postgresql://cplane:${POSTGRES_PASSWORD}@postgresd:5432/cplane
    depends_on:
      postgresd:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1.3
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data

  openbao:
    image: openbao/openbao:2.5.5
    command: server
    environment:
      BAO_LOCAL_CONFIG: >-
        {"disable_mlock":true,"api_addr":"http://openbao:8200","cluster_addr":"http://openbao:8201","listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"storage":{"raft":{"path":"/openbao/file","node_id":"cplane"}}}
    volumes:
      - openbao_data:/openbao/file
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1 || [ $? -eq 2 ]"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao-init:
    image: openbao/openbao:2.5.5
    command: ["sh", "-ec", "bao operator unseal \"$${BAO_UNSEAL_KEY}\" && (bao secrets enable -path=cplane -version=2 kv 2>/dev/null || true)"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${OPENBAO_ROOT_TOKEN}
      BAO_UNSEAL_KEY: ${OPENBAO_UNSEAL_KEY}
    depends_on:
      openbao:
        condition: service_healthy

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    depends_on:
      - postgresd
    environment:
      PORT: 4983
      DATABASE_URL_DEFAULT: postgresql://cplane:${POSTGRES_PASSWORD}@postgresd:5432/cplane
    ports:
      - "8001:4983"
    volumes:
      - drizzle-gateway:/app

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  valkey-data:
  drizzle-gateway:
  openbao_data:
