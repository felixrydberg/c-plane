name: cplane-prod
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: c-plane
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      BETTER_AUTH_SESSION_URL: http://ui:3000/api/auth/get-session
      IDENTITY_DATABASE_URL: postgresql://cplane_identity:${POSTGRES_IDENTITY_PASSWORD}@postgresd:5432/cplane
      TENANT_DATABASE_URL: postgresql://cplane_tenant:${POSTGRES_TENANT_PASSWORD}@postgresd:5432/cplane
      CONTROL_PLANE_URL: http://control-plane-ui:3001
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
    depends_on:
      - postgresd
      - ui
      - control-plane-ui
    ports:
      - 8080:8080

  ui:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        PACKAGE: ui
      target: "production"
    environment:
      NODE_ENV: production
      NUXT_DATABASE_URL: postgresql://ui:${POSTGRES_UI_PASSWORD}@postgresd:5432/cplane
      NUXT_IDENTITY_DATABASE_URL: postgresql://cplane_identity:${POSTGRES_IDENTITY_PASSWORD}@postgresd:5432/cplane
      NUXT_TENANT_DATABASE_URL: postgresql://cplane_tenant:${POSTGRES_TENANT_PASSWORD}@postgresd:5432/cplane
      NUXT_REDIS_URL: redis://valkey:6379
      NUXT_RESEND_API_KEY: ${RESEND_API_KEY}
      NUXT_AUTH_BASE_URL: http://ui:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BACKEND_URL: http://api:8080
    ports:
      - 3000:3000
      - 24678:24678
    develop:
      watch:
        - action: sync
          path: ./packages/ui
          target: /usr/src/app/packages/ui
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
        - action: sync
          path: ./packages/ui-shared
          target: /usr/src/app/packages/ui-shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/ui/package.json
        - action: rebuild
          path: ./packages/ui-shared/package.json

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.dioxus
      target: "production"
    environment:
      ADMIN_DATABASE_URL: postgresql://cplane_admin:${POSTGRES_ADMIN_PASSWORD}@postgresd:5432/cplane
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN}
      CPLANE_SERVICE_TOKEN: ${CPLANE_SERVICE_TOKEN}
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3001"

  postgresd:
    image: postgres:18
    environment:
      POSTGRES_DB: cplane
      POSTGRES_USER: cplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_UI_PASSWORD: ${POSTGRES_UI_PASSWORD}
      POSTGRES_IDENTITY_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      POSTGRES_TENANT_PASSWORD: ${POSTGRES_TENANT_PASSWORD}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./packages/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cplane"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.1.3
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    ports:
      - "6379:6379"

  openbao:
    image: openbao/openbao:2.5.5
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao-init:
    image: openbao/openbao:2.5.5
    command: ["sh", "-ec", "bao secrets enable -path=cplane -version=2 kv 2>/dev/null || true"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN}
    depends_on:
      openbao:
        condition: service_healthy

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    depends_on:
      - postgresd
    environment:
      PORT: 4983
      DATABASE_URL_DEFAULT: postgresql://cplane:${POSTGRES_PASSWORD}@postgresd:5432/cplane
    ports:
      - "8001:4983"
    volumes:
      - drizzle-gateway:/app

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ui

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  valkey-data:
  drizzle-gateway:
