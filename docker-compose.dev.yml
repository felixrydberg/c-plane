name: cplane
services:
  cplane:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: c-plane
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      BETTER_AUTH_SESSION_URL: http://ui:3000/api/auth/get-session
      APP_IDENTITY_DATABASE_URL: postgresql://cplane_identity:${POSTGRES_IDENTITY_PASSWORD}@postgresd:5432/cplane
      APP_TENANT_DATABASE_URL: postgresql://cplane_tenant:${POSTGRES_TENANT_PASSWORD}@postgresd:5432/cplane
    depends_on:
      - postgresd
      - ui
    ports:
      - 8080:8080

  ui:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        PACKAGE: ui
      target: "development"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      WATCHPACK_POLLING: "true"
      NUXT_DATABASE_URL: postgresql://ui:${POSTGRES_UI_PASSWORD}@postgresd:5432/cplane
      NUXT_REDIS_URL: redis://valkey:6379
      NUXT_RESEND_API_KEY: ${RESEND_API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - 3000:3000
      - 24678:24678
    develop:
      watch:
        - action: sync
          path: ./packages/ui
          target: /usr/src/app/packages/ui
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
        - action: sync
          path: ./packages/ui-shared
          target: /usr/src/app/packages/ui-shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/ui/package.json
        - action: rebuild
          path: ./packages/ui-shared/package.json

  ui-studio:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        PACKAGE: ui-studio
      target: "development"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      WATCHPACK_POLLING: "true"
      NUXT_DATABASE_URL: postgresql://ui:${POSTGRES_UI_PASSWORD}@postgresd:5432/cplane
      NUXT_REDIS_URL: redis://valkey:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - 3001:3001
      - 24679:24679
    develop:
      watch:
        - action: sync
          path: ./packages/ui-studio
          target: /usr/src/app/packages/ui-studio
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
        - action: sync
          path: ./packages/ui-shared
          target: /usr/src/app/packages/ui-shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/ui-studio/package.json
        - action: rebuild
          path: ./packages/ui-shared/package.json

  postgresd:
    image: postgres:18
    environment:
      POSTGRES_DB: cplane
      POSTGRES_USER: cplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_UI_PASSWORD: ${POSTGRES_UI_PASSWORD}
      POSTGRES_IDENTITY_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD}
      POSTGRES_TENANT_PASSWORD: ${POSTGRES_TENANT_PASSWORD}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./packages/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cplane"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.1.3
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    ports:
      - "6379:6379"

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    depends_on:
      - postgresd
    environment:
      PORT: 4983
      DATABASE_URL_DEFAULT: postgresql://cplane:${POSTGRES_PASSWORD}@postgresd:5432/cplane
    ports:
      - "8001:4983"
    volumes:
      - drizzle-gateway:/app

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ui

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  valkey-data:
  drizzle-gateway:
