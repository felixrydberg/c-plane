services:
  observability:
    image: grafana/otel-lgtm:0.33.0
    depends_on:
      - ingress
      - api
      - ui
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/cplane/cplane-overview.json
    volumes:
      - observability_data:/data
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/cplane.yaml:ro
      - ./observability/cplane-overview.json:/otel-lgtm/grafana/conf/provisioning/dashboards/cplane/cplane-overview.json:ro

volumes:
  observability_data:
